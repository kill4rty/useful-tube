<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unblocked Games Hub</title>
  <style>
    /* ── Reset & base ── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      padding: 2rem 1rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    /* ── Container ── */
    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      flex: 1;
      width: 100%;
    }

    /* ── Setup box ── */
    .setup-box {
      background: #1e293b;
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid #334155;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.5rem;
    }
    .setup-box label {
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .setup-box select {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 0.4rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      outline: none;
    }
    .setup-box select:focus {
      border-color: #38bdf8;
    }
    .setup-box small {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-left: auto;
      max-width: 500px;
    }
    .setup-box small a {
      color: #38bdf8;
      text-decoration: none;
    }
    .setup-box small a:hover {
      text-decoration: underline;
    }
    #proxy-status {
      font-size: 0.85rem;
      color: #4ade80;
      margin-left: 0.5rem;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #1e293b;
      padding-bottom: 0.5rem;
    }
    .tab {
      padding: 0.5rem 1.25rem;
      border-radius: 30px;
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
      border: 1px solid transparent;
      user-select: none;
    }
    .tab:hover {
      background: #334155;
      color: #e2e8f0;
    }
    .tab.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    /* ── Tab content ── */
    .tab-content {
      display: none;
      animation: fade 0.2s ease;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fade {
      from {
        opacity: 0.4;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Game grid ── */
    #results,
    #action-results,
    #puzzle-results,
    #sports-results,
    #search-results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-top: 0.5rem;
    }
    .game-card {
      background: #1e293b;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #334155;
      transition: 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .game-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.15);
    }
    .game-card .thumbnail {
      width: 100%;
      height: 130px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1px;
      border-bottom: 1px solid #334155;
    }
    .game-card .info {
      padding: 0.75rem 1rem 1rem;
      flex: 1;
    }
    .game-card .info h4 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }
    .game-card .info .category {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Search row ── */
    .search-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .search-row input {
      flex: 1;
      min-width: 200px;
      padding: 0.6rem 1rem;
      border-radius: 30px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
    }
    .search-row input:focus {
      border-color: #38bdf8;
    }
    .search-row button {
      padding: 0.6rem 1.8rem;
      border-radius: 30px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .search-row button:hover {
      background: #7dd3fc;
    }

    /* ── Status / empty ── */
    .status {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: #64748b;
      font-style: italic;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .setup-box {
        flex-direction: column;
        align-items: stretch;
      }
      .setup-box small {
        margin-left: 0;
        max-width: 100%;
      }
      header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

    </div>

    <!-- Tabs -->
    <div class="tabs">

      <div class="tab" data-tab="puzzle">🧩 Puzzle</div>
      <div class="tab" data-tab="sports">⚽ Sports</div>
      <div class="tab" data-tab="search">🔍 Search</div>

    <!-- Tab Contents -->
    <div id="popular-tab" class="tab-content active">

    </div>
    <div id="action-tab" class="tab-content">
      <div id="action-results"></div>
    </div>
    <div id="puzzle-tab" class="tab-content">

    </div>
    <div id="sports-tab" class="tab-content">

    </div>
    <div id="search-tab" class="tab-content">
      <div class="search-row">
        <input type="text" id="search-input" placeholder="Search for games..." />
        <button id="search-btn">Search</button>
      </div>
      <div id="search-results"></div>

  </div>

        {

          url: 'https://ottergames.org/g/golf-pro',
        },

        // ── Extra duplicates for better visibility ──
        {
          id: 32,
          title: 'Minecraft Classic',
          category: 'action',
          url: 'https://classic.minecraft.net/',
        },
        {
          id: 33,
          title: 'Bloxd.io',

          url: 'https://bloxd.io/',
        },
        {
          id: 34,
          title: 'Pac-Man',
          category: 'puzzle',
          url: 'https://www.google.com/logos/2010/pacman10-hp.html',
        },
      ];

      // ─── DOM refs ─────────────────────────────────────────────────────────
      const tabs = document.querySelectorAll('.tab');
      const tabContents = {
        popular: document.getElementById('results'),
        action: document.getElementById('action-results'),
        puzzle: document.getElementById('puzzle-results'),
        sports: document.getElementById('sports-results'),
        search: document.getElementById('search-results'),
      };
      const searchInput = document.getElementById('search-input');
      const searchBtn = document.getElementById('search-btn');
      const proxySelect = document.getElementById('proxy-select');
      const proxyStatus = document.getElementById('proxy-status');

      // ─── Helper: get initials for thumbnail ────────────────────────────
      function getInitials(title) {
        return title
          .split(' ')
          .slice(0, 2)
          .map((word) => word[0])
          .join('')
          .toUpperCase();
      }

      // ─── Helper: render game cards ────────────────────────────────────
      function renderGames(container, gameList) {
        if (!container) return;
        if (!gameList || gameList.length === 0) {
          container.innerHTML = `<div class="status">No games found.</div>`;
          return;
        }
        let html = '';
        gameList.forEach((game) => {
          const initials = getInitials(game.title);
          html += `
            <div class="game-card" data-url="${game.url}">
              <div class="thumbnail">${initials}</div>
              <div class="info">
                <h4>${game.title}</h4>
                <span class="category">${game.category}</span>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;

        container.querySelectorAll('.game-card').forEach((card) => {
          card.addEventListener('click', function () {
            const url = this.dataset.url;
            window.open(url, '_blank');
          });
        });
      }

      // ─── Filter games by category ────────────────────────────────────
      function getGamesByCategory(cat) {
        return GAMES.filter((g) => g.category === cat);
      }

      // ─── Search games ─────────────────────────────────────────────────
      function searchGames(query) {
        const q = query.trim().toLowerCase();
        if (!q) return GAMES;
        return GAMES.filter((g) => g.title.toLowerCase().includes(q));
      }

      // ─── Tab switching ─────────────────────────────────────────────────
      function switchTab(tabId) {
        tabs.forEach((tab) => {
          tab.classList.toggle('active', tab.dataset.tab === tabId);
        });
        Object.keys(tabContents).forEach((key) => {
          const content = document.getElementById(key + '-tab');
          if (content) {
            content.classList.toggle('active', key === tabId);
          }
        });

        if (tabId === 'popular') {
          renderGames(tabContents.popular, GAMES);
        } else if (tabId === 'action') {
          renderGames(tabContents.action, getGamesByCategory('action'));
        } else if (tabId === 'puzzle') {
          renderGames(tabContents.puzzle, getGamesByCategory('puzzle'));
        } else if (tabId === 'sports') {
          renderGames(tabContents.sports, getGamesByCategory('sports'));
        } else if (tabId === 'search') {
          const query = searchInput.value;
          const results = searchGames(query);
          renderGames(tabContents.search, results);
        }
      }

      // ─── Proxy status update (visual only) ──────────────────────────
      function updateProxyStatus() {
        const val = proxySelect.value;
        const labels = {
          none: '● Direct',
          'hide-me': '🔒 Hide.me',
          'holy-unblocker': '🔒 Holy Unblocker',
          ultraviolet: '🔒 Ultraviolet',
          iproyal: '🔒 IPRoyal',
          '4everproxy': '🔒 4everProxy',
        };
        proxyStatus.textContent = labels[val] || '● Direct';
      }
      proxySelect.addEventListener('change', updateProxyStatus);
      updateProxyStatus();

      // ─── Event listeners ──────────────────────────────────────────────

      tabs.forEach((tab) => {
        tab.addEventListener('click', function () {
          switchTab(this.dataset.tab);
        });
      });

      function performSearch() {
        const query = searchInput.value;
        const results = searchGames(query);
        renderGames(tabContents.search, results);
        switchTab('search');
      }
      searchBtn.addEventListener('click', performSearch);
      searchInput.addEventListener('keyup', function (e) {
        if (e.key === 'Enter') performSearch();
      });

      // ─── Initial load ──────────────────────────────────────────────────
      renderGames(tabContents.popular, GAMES);
      renderGames(tabContents.action, getGamesByCategory('action'));
      renderGames(tabContents.puzzle, getGamesByCategory('puzzle'));
      renderGames(tabContents.sports, getGamesByCategory('sports'));

      console.log('🎮 Unblocked Games Hub ready – all games open in new tabs!');
