<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048 – GitHub Game</title>
  <style>
    /* ── Super simple style ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eee;
      padding: 1rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sub {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 1.5rem;
    }
    .sub a {
      color: #58a6ff;
      text-decoration: none;
    }
    .sub a:hover {
      text-decoration: underline;
    }
    .game-wrapper {
      background: #16213e;
      border-radius: 20px;
      padding: 0.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      max-width: 100%;
      width: fit-content;
    }
    iframe {
      border: none;
      border-radius: 16px;
      width: 500px;
      height: 600px;
      max-width: 100%;
      display: block;
      background: #faf8ef;
    }
    @media (max-width: 520px) {
      iframe {
        height: 500px;
      }
    }
  </style>
</head>
<body>

  <h1>2048</h1>
  <p class="sub">
    Open‑source game from
    <a href="https://github.com/gabrielecirulli/2048" target="_blank">GitHub</a>
    · hosted on GitHub Pages
  </p>

  <div class="game-wrapper">
    <iframe
      src="https://gabrielecirulli.github.io/2048/"
      allowfullscreen
    ></iframe>
  </div>

  <p style="margin-top: 1.5rem; font-size: 0.8rem; color: #666;">
    If the game doesn't load, try opening it
    <a href="https://gabrielecirulli.github.io/2048/" target="_blank" style="color:#58a6ff;">directly</a>
    (some networks block iframes).
  </p>

</body>
</html>
