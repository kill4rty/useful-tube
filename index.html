<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unblocked Games Hub</title>
  <style>
    /* ── same styles as before ── */
    /* (copy your existing CSS here or keep it unchanged) */
    * { box-sizing: border-box; margin:0; padding:0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; display:flex; flex-direction:column; }
    header { background: linear-gradient(145deg,#1e293b,#0f172a); padding:2rem 1rem 1.5rem; text-align:center; border-bottom:1px solid #334155; }
    header h1 { font-size:2.5rem; font-weight:700; background:linear-gradient(135deg,#38bdf8,#818cf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    header p { font-size:1.1rem; color:#94a3b8; margin-top:0.25rem; }
    .container { max-width:1300px; margin:0 auto; padding:1.5rem 1rem; flex:1; width:100%; }
    .setup-box { background:#1e293b; border-radius:16px; padding:1.25rem 1.5rem; margin-bottom:2rem; border:1px solid #334155; display:flex; flex-wrap:wrap; align-items:center; gap:1rem 1.5rem; }
    .setup-box label { font-weight:600; color:#cbd5e1; display:flex; align-items:center; gap:0.5rem; }
    .setup-box select { background:#0f172a; color:#e2e8f0; border:1px solid #475569; padding:0.4rem 1rem; border-radius:8px; font-size:0.95rem; cursor:pointer; outline:none; }
    .setup-box select:focus { border-color:#38bdf8; }
    .setup-box small { color:#94a3b8; font-size:0.85rem; margin-left:auto; max-width:500px; }
    .setup-box small a { color:#38bdf8; text-decoration:none; }
    .setup-box small a:hover { text-decoration:underline; }
    #proxy-status { font-size:0.85rem; color:#4ade80; margin-left:0.5rem; }
    .tabs { display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1.5rem; border-bottom:2px solid #1e293b; padding-bottom:0.5rem; }
    .tab { padding:0.5rem 1.25rem; border-radius:30px; background:#1e293b; color:#94a3b8; cursor:pointer; font-weight:500; transition:0.2s; border:1px solid transparent; user-select:none; }
    .tab:hover { background:#334155; color:#e2e8f0; }
    .tab.active { background:#38bdf8; color:#0f172a; border-color:#38bdf8; }
    .tab-content { display:none; animation:fade 0.2s ease; }
    .tab-content.active { display:block; }
    @keyframes fade { from { opacity:0.4; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    #results, #action-results, #puzzle-results, #sports-results, #search-results {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:1.25rem; margin-top:0.5rem;
    }
    .game-card { background:#1e293b; border-radius:14px; overflow:hidden; border:1px solid #334155; transition:0.2s; cursor:pointer; display:flex; flex-direction:column; }
    .game-card:hover { transform:translateY(-4px); border-color:#38bdf8; box-shadow:0 8px 20px rgba(56,189,248,0.15); }
    .game-card .thumbnail { width:100%; height:130px; background:#0f172a; display:flex; align-items:center; justify-content:center; font-size:2.5rem; font-weight:700; color:#38bdf8; letter-spacing:1px; border-bottom:1px solid #334155; }
    .game-card .info { padding:0.75rem 1rem 1rem; flex:1; }
    .game-card .info h4 { font-size:1rem; font-weight:600; margin-bottom:0.2rem; }
    .game-card .info .category { font-size:0.75rem; color:#94a3b8; text-transform:uppercase; letter-spacing:0.5px; }
    .search-row { display:flex; gap:0.75rem; margin-bottom:1.5rem; flex-wrap:wrap; }
    .search-row input { flex:1; min-width:200px; padding:0.6rem 1rem; border-radius:30px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-size:1rem; outline:none; }
    .search-row input:focus { border-color:#38bdf8; }
    .search-row button { padding:0.6rem 1.8rem; border-radius:30px; border:none; background:#38bdf8; color:#0f172a; font-weight:600; cursor:pointer; transition:0.2s; }
    .search-row button:hover { background:#7dd3fc; }
    #game-area { margin-top:2rem; background:#0f172a; border-radius:16px; border:1px solid #334155; overflow:hidden; position:relative; min-height:400px; display:none; flex-direction:column; }
    #game-area.active { display:flex; }
    #game-area .game-header { display:flex; justify-content:space-between; align-items:center; padding:0.75rem 1.25rem; background:#1e293b; border-bottom:1px solid #334155; }
    #game-area .game-header span { font-weight:600; }
    #game-area .game-header button { background:transparent; border:none; color:#f87171; font-size:1.2rem; cursor:pointer; padding:0 0.5rem; }
    #game-area .game-header button:hover { color:#fca5a5; }
    #game-area iframe { width:100%; min-height:500px; border:none; background:#ffffff; flex:1; }
    .status { grid-column:1/-1; text-align:center; padding:3rem 1rem; color:#64748b; font-style:italic; }
    @media (max-width:640px) { .setup-box { flex-direction:column; align-items:stretch; } .setup-box small { margin-left:0; max-width:100%; } header h1 { font-size:1.8rem; } }
  </style>
</head>
<body>

<div class="container">
